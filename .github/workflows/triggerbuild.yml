    - name: Delete duplicated packages
      run: |
        shopt -s extglob
        set +e
        rm -Rf */.git
        for dir in */; do
          [ "$dir" = ".github/" ] && continue
          find "$dir" -type f \( -name "LICENSE" -o -name "*.md" \) -delete 2>/dev/null || true
          find "$dir" -type d -name "doc*" -exec rm -rf {} + 2>/dev/null || true
          find "$dir" -type d -name ".??*" ! -name ".git" ! -name ".github" -exec rm -rf {} + 2>/dev/null || true
          if [ -d "$dir/po" ]; then
            (
              cd "$dir/po" || continue
              for lang in $(ls -d */ 2>/dev/null | sed 's/\/$//'); do
                case "$lang" in
                  templates|zh-cn|zh_CN|zh_Hans|en) ;;
                  *) rm -rf "$lang" ;;
                esac
              done
            )
          fi
        done
        for pkg in $(ls -d .github/diy/packages/*); do
          mv -f $pkg/Makefile.k $pkg/Makefile >/dev/null 2>&1 || true
        done
        cp -rf .github/diy/packages/* ./ || true
        for pkg in $(ls -d .github/diy/packages/*); do
          mv -f $pkg/Makefile $pkg/Makefile.k >/dev/null 2>&1 || true
        done
        rm -rf */.github
        
    - name: Apply patches
      run: |
        find ".github/diy/patches" -type f -name '*.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -p1 -E -f -F 1 --no-backup-if-mismatch -i '%'"
        
    - name: Modify
      run: |
        shopt -s extglob
        set +e
        sed -i \
        -e "s/\(network\..*\)\.ifname/\1.device/g" \
        `find \( -path "*/root/*" -o -path "*/files/*" -o -path "*/luasrc/*" \) ! -path "./base-files/*" ! -path "./dnsmasq/*" ! -path "./luci-base/*" ! -path "./ppp/*" -type f` &
        # sed -i -e "s/\(killall .*\)-[0-9] /\1-3 /g" \
        -e "s/killall \([^-]+*\)/killall -3 \1/g" \
        `find \( -path "*/files/root/etc/init.d/*" -o -path "*/root/etc/init.d/*" -o -path "*/files/*.init" \) -type f` &
        (
        function latest() {
          (curl -gs -H 'Content-Type: application/json' \
             -H "Authorization: Bearer ${{ secrets.TOKEN_LEARNSCODE }}" \
             -X POST -d '{ "query": "query {repository(owner: \"'"$1"'\", name: \"'"$2"'\"){latestRelease{tagName tagCommit{oid}}refs(refPrefix:\"refs/tags/\",last:1,orderBy:{field:TAG_COMMIT_DATE,direction:ASC}){edges{node{name target{oid}}}}defaultBranchRef{target{...on Commit {oid}}}}}"}' https://api.github.com/graphql)
        }
        for pkg in $(ls */Makefile 2>/dev/null); do
          repo="$(grep ^PKG_SOURCE_URL $pkg | grep github | cut -f 4-5 -d '/' | sed -e 's/.git//' | grep -E '[0-9a-zA-Z_-]+$')" || true
          if [ "$repo" ]; then
            owner="$(echo $repo | cut -f 1 -d '/')"
            name="$(echo $repo | cut -f 2 -d '/')"
            latest="$(latest $owner $name)"
            sed -i "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$(echo $latest | jq -r '.data.repository.defaultBranchRef.target.oid')/" $pkg || true
            over="$(grep -E PKG_VERSION:=.*$ $pkg | cut -f 2 -d '=' | sed -e 's/^\(v\|release-\)//' | grep -E "[0-9]")" || true
            if [ "$over" ]; then
              ver="$(echo $latest | jq -r '.data.repository.latestRelease.tagName' | sed -e 's/^\(v\|release-\)//' | grep -E "^[^()]*$" | grep -E "[0-9]")" || true
              # [ "$ver" ] || ver="$(git ls-remote --tags git://github.com/$repo | cut -d/ -f3- | sort -t. -nk1,3 | awk '/^[^{]*$/{version=$1}END{print version}' | grep -o -E "[0-9].*")" || true
              echo "$repo-$over-$ver"
              if [ "$ver" ]; then
                function version_lt() { test "$(echo "$@" | tr " " "\n" | sort -rV | head -n 1)" != "$1"; }
                if version_lt "$over" "$ver"; then
                  latest="$(echo $latest | jq -r '.data.repository.latestRelease.tagCommit.oid' || echo $latest | jq -r '.data.repository.refs.edges[-1].node.target.oid')"
                  sed -i -e "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$latest/" \
                         -e "s/PKG_VERSION:=.*/PKG_VERSION:=$ver/" $pkg || true
                fi || true
              fi
            fi
          fi
        done
        touch /tmp/ok
        ) &
        
        sed -i \
          -e 's?include \.\./\.\./\(lang\|devel\)?include $(TOPDIR)/feeds/packages/\1?' \
          -e "s/\(\(^\| \|	\)\(PKG_HASH\|PKG_MD5SUM\|PKG_MIRROR_HASH\|HASH\):=\).*/\1skip/" \
          -e 's?include .*/luci.mk?include $(TOPDIR)/feeds/luci/luci.mk?' \
          */Makefile

        chmod +x .github/diy/*.sh
        bash .github/diy/create_acl_for_luci.sh -a >/dev/null 2>&1 || true
        bash .github/diy/convert_translation.sh -a >/dev/null 2>&1 || true
        bash .github/diy/create_ucitrack_for_luci.sh -a >/dev/null 2>&1 || true
        bash .github/diy/generate_ucitrack.sh -a >/dev/null 2>&1 || true
        chmod -R +x luci-*/root/etc/init.d/ luci-*/root/bin/ luci-*/root/sbin/ luci-*/root/usr/libexec/ luci-*/root/usr/bin/ luci-*/root/usr/sbin/
        find . -path "./luci-*/root/usr/share/*" -name "*.sh" -type f -exec chmod +x {} \;
        
        while [[ ! -f /tmp/ok ]]; do
            echo "wait"
          sleep 1
        done

    - name: Customize
      run: |
        sed -E -i 's/config_get[[:space:]]+port[[:space:]]+\$1[[:space:]]+port[[:space:]]+5244/config_get port $1 port 8888/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+allow_wan[[:space:]]+\$1[[:space:]]+allow_wan[[:space:]]+0/config_get allow_wan $1 allow_wan 1/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+temp_dir[[:space:]]+\$1[[:space:]]+temp_dir[[:space:]]+"\/tmp\/openlist"/config_get temp_dir $1 temp_dir "\/opt\/cache"/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+token_expires_in[[:space:]]+\$1[[:space:]]+token_expires_in[[:space:]]+48/config_get token_expires_in $1 token_expires_in 999999/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+ssl[[:space:]]+\$1[[:space:]]+ssl[[:space:]]+0/config_get ssl $1 ssl 1/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+ssl_cert[[:space:]]+\$1[[:space:]]+ssl_cert[[:space:]]+""/config_get ssl_cert $1 ssl_cert "\/etc\/ssl.crt"/' openlist/files/openlist.init
        sed -E -i 's/config_get[[:space:]]+ssl_key[[:space:]]+\$1[[:space:]]+ssl_key[[:space:]]+""/config_get ssl_key $1 ssl_key "\/etc\/ssl.key"/' openlist/files/openlist.init

        sed -i 's/option enabled '\''0'\''/option enabled '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option port '\''5244'\''/option port '\''8888'\''/' openlist/files/openlist.config
        sed -i 's/option allow_wan '\''0'\''/option allow_wan '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option temp_dir '\''\/tmp\/openlist'\''/option temp_dir '\''\/opt\/cache'\''/' openlist/files/openlist.config
        sed -i 's/option token_expires_in '\''48'\''/option token_expires_in '\''999999'\''/' openlist/files/openlist.config
        sed -i 's/option ssl '\''0'\''/option ssl '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option ssl_cert '\'''\''/option ssl_cert '\''\/etc\/ssl.crt'\''/' openlist/files/openlist.config
        sed -i 's/option ssl_key '\'''\''/option ssl_key '\''\/etc\/ssl.key'\''/' openlist/files/openlist.config

        cp .github/diy/data.db openlist/files/data.db

        sed -i '/-X.*WebVersion=v$(PKG_WEB_VERSION)/ s/$/ \\/' openlist/Makefile
        sed -i '/-X.*WebVersion=v$(PKG_WEB_VERSION)/a \\t-s -w' openlist/Makefile
        sed -i '/$(INSTALL_DATA) $(CURDIR)\/files\/data.db $(1)\/etc\/openlist\/data.db/a \\t/usr/bin/upx --lzma --best $(1)/usr/bin/openlist' openlist/Makefile
        
        sed -i "s/o.default = '5244';/o.default = '8888';/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
        sed -i "s/o.default = '\/tmp\/openlist';/o.default = '\/opt\/cache';/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
        sed -i "s/o.default = '48';/o.default = '999999';/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js

    - name: Apply
      id: apply
      run: |
        cd $GITHUB_WORKSPACE
        if [ -z "$(git status --porcelain)" ]; then
          echo "✅ No changes to commit, skipping apply."
          echo "changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
        git add .
        if git diff --cached --quiet; then
          echo "✅ No staged changes after add, skipping commit."
          echo "changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        git commit -m "${Emoji[$[$RANDOM % ${#Emoji[@]}]]} Sync $(date +%Y-%m-%d" "%H:%M:%S)"
        git push -f
        echo "changed=true" >> $GITHUB_OUTPUT

    - name: Trigger OpenWrt build
      if: steps.apply.outputs.changed == 'true'
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.TOKEN_OPENWRT }}" \
          https://api.github.com/repos/AspirantH/openwrt/dispatches \
          -d '{"event_type": "packages-updated", "client_payload": {"target": "x86_64"}}'

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 1
        keep_minimum_runs: 1
