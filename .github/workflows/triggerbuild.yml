          | sed 's|/||g' \
          | sort -rV \
          | head -n 1 \
          | sed 's/^v//')
        if [ -n "$LATEST_VER" ]; then
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$LATEST_VER/" verysync/Makefile
          sed -i "s/PKG_HASH_VERYSYNC:=.*/PKG_HASH_VERYSYNC:=skip/" verysync/Makefile
          echo "verysync version updated to $LATEST_VER"
        else
          echo "Failed to fetch latest verysync version, keeping original."
        fi
        git_sparse_clone main "https://github.com/kiddin9/op-packages" luci-app-verysync
        sed -i 's/{"admin", "nas", "verysync"/{"admin", "services", "verysync"/g' luci-app-verysync/luasrc/controller/verysync.lua
        sed -i 's/\[\[nas\]\]/[[services]]/g' luci-app-verysync/luasrc/view/verysync/verysync_status.htm
        sed -i '/^function act_status()/,/^end/c\
        function act_status()\
          local e = {}\
          e.running = luci.sys.call("pgrep verysync >/dev/null") == 0\
          local port = luci.sys.exec("uci -q get verysync.verysync.port 2>/dev/null || uci -q get verysync.@verysync[0].port 2>/dev/null")\
          e.port = tonumber(port) or 0\
          luci.http.prepare_content("application/json")\
          luci.http.write_json(e)\
        end' luci-app-verysync/luasrc/controller/verysync.lua
        sed -i 's/entry({"admin", "services", "verysync", "status"}, call("act_status"), nil, 20, true).leaf = true/entry({"admin", "services", "verysync", "status"}, call("act_status")).leaf = true/' luci-app-verysync/luasrc/controller/verysync.lua
        sed -i '/if (data && tb) {/a\\        window.verysync_port = data.port || 0;' luci-app-verysync/luasrc/view/verysync/verysync_status.htm
        sed -i '/^function openClient()/,/^}/c\
        function openClient() {\
          if (!window.verysync_port) {\
            alert("Unable to get Verysync port, please check your configuration.");\
            return;\
          }\
          var url = window.location.protocol + "//" + window.location.hostname + ":" + window.verysync_port;\
          window.open(url);\
        }' luci-app-verysync/luasrc/view/verysync/verysync_status.htm
        
