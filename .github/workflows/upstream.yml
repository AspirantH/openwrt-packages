name: Merge-upstream
on:
  push:
    paths:
      - '.github/workflows/upstream.yml'
      - '.gitignore'
      - '.github/diy/**'
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch:
    inputs:
      ssh:
        description: 'ssh'
        required: false
        default: 'true'
  watch:
    types: started
  repository_dispatch:

jobs:
  merge:
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id || github.event.sender.id == '119362912'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set git identity
        run : |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github‑actions‑bot"
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Sync upstream
        shell: /usr/bin/bash
        run: |
          shopt -s extglob
          set +e
          git rm -r --cache * >/dev/null 2>&1 &
          rm -rf `find ./* -maxdepth 0 -type d ! -name ".github"` >/dev/null 2>&1
          function git_clone() {
            git clone --depth 1 $1 $2
          }
          function git_sparse_clone() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" curl="$2" && shift 2
            rootdir="$PWD"
            tmpdir="$(mktemp -d)"
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$curl" "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$curl" "$tmpdir"
              cd "$tmpdir"
              git checkout "$branch"
            fi
            git sparse-checkout init --cone
            git sparse-checkout set "$@"
            for item in "$@"
            do
              [ -e "$tmpdir/$item" ] && mv -n "$tmpdir/$item" "$rootdir"/
            done
            cd "$rootdir"
            return 0
          }
          function mvdir() {
            ls -A $1/* >/dev/null 2>&1 && mv -n `find $1/* -maxdepth 0 -type d` ./
            rm -rf $1
          }
          
          git_clone https://github.com/AspirantH/luci-app-lucky oplucky && mvdir oplucky
          git_clone https://github.com/sirpdboy/luci-app-partexp partexp && mvdir partexp
          git_clone https://github.com/EasyTier/luci-app-easytier luci-app-easytier1 && mvdir luci-app-easytier1
          git_clone https://github.com/OpenListTeam/OpenList-OpenWRT oplist && mvdir oplist
          
          sed -i "s/config_get port \$1 port 5244/config_get port \$1 port 8888/" openlist/files/openlist.init
          sed -i "s/config_get allow_wan \$1 allow_wan 0/config_get allow_wan \$1 allow_wan 1/" openlist/files/openlist.init
          sed -i "s/config_get temp_dir \$1 temp_dir \"\/tmp\/openlist\"/config_get temp_dir \$1 temp_dir \"\/opt\/cache\"/" openlist/files/openlist.init
          sed -i "s/config_get token_expires_in \$1 token_expires_in 48/config_get token_expires_in \$1 token_expires_in 999999/" openlist/files/openlist.init
          sed -i "s/config_get ssl \$1 ssl 0/config_get ssl \$1 ssl 1/" openlist/files/openlist.init
          sed -i "s/config_get ssl_cert \$1 ssl_cert \"\"/config_get ssl_cert \$1 ssl_cert \"\/etc\/ssl.crt\"/" openlist/files/openlist.init
          sed -i "s/config_get ssl_key \$1 ssl_key \"\"/config_get ssl_key \$1 ssl_key \"\/etc\/ssl.key\"/" openlist/files/openlist.init
          
          sed -i "s/option enabled '0'/option enabled '1'/" openlist/files/openlist.config
          sed -i "s/option port '5244'/option port '8888'/" openlist/files/openlist.config
          sed -i "s/option allow_wan '0'/option allow_wan '1'/" openlist/files/openlist.config
          sed -i "s/option temp_dir '\/tmp\/openlist'/option temp_dir '\/opt\/cache'/" openlist/files/openlist.config
          sed -i "s/option token_expires_in '48'/option token_expires_in '999999'/" openlist/files/openlist.config
          sed -i "s/option ssl '0'/option ssl '1'/" openlist/files/openlist.config
          sed -i "s/option ssl_cert ''/option ssl_cert '\/etc\/ssl.crt'/" openlist/files/openlist.config
          sed -i "s/option ssl_key ''/option ssl_key '\/etc\/ssl.key'/" openlist/files/openlist.config
          
          cp -f .github/diy/data.db openlist/files/data.db
          
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=skip/" openlist/Makefile
          sed -i "/HASH:=/ s/=.*/=skip/" openlist/Makefile
          sed -i "/GO_PKG_LDFLAGS:= \\\$/ ,+6 s/$/ \\\n        -s -w/" openlist/Makefile
          sed -i "/define Package\/openlist\/install/,/endef/{/endef/i\\t\/usr\/bin\/upx --lzma --best \$(1)\/usr\/bin\/openlist
          }" openlist/Makefile
          
          sed -i "s/o\.default = '5244'/o.default = '8888'/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
          sed -i "s/o\.default = '\/tmp\/openlist'/o.default = '\/opt\/cache'/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
          sed -i "s/o\.default = '48'/o.default = '999999'/" luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
          
          git_clone https://github.com/eamonxg/luci-theme-aurora luci-theme-aurora && cd luci-theme-aurora && rm -rf .??* docs* *.md LICENSE && cd ..
          git_clone https://github.com/destan19/luci-app-harbor-file luci-app-harbor-file && cd luci-app-harbor-file && rm -rf .??* docs* *.md LICENSE && cd ..
          git_sparse_clone master "https://github.com/coolsnowwolf/packages" net/verysync
          git_sparse_clone main "https://github.com/kiddin9/op-packages" luci-app-verysync luci-mod-network luci-mod-system
          [ -d luci-mod-system ] && rm -rf luci-mod-system/htdocs/luci-static/resources/view/system/leds*
          [ -f luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json ] && sed -i '/"admin\/system\/leds": {/,/^	},/d' luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json
          [ -f luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json ] && sed -i '/"fs": { "\/sys\/class\/leds": "directory" },/,/^	},/d' luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json
          [ -f luci-mod-system/root/usr/share/ucitrack/luci-mod-system.json ] && sed -i '/"init": "led",/d' luci-mod-system/root/usr/share/ucitrack/luci-mod-system.json
          [ -f luci-mod-system/root/usr/share/rpcd/acl.d/luci-mod-system.json ] && sed -i 's/"getLEDs", //g' luci-mod-system/root/usr/share/rpcd/acl.d/luci-mod-system.json
          
          git_sparse_clone openwrt-25.12 "https://github.com/coolsnowwolf/luci" applications/luci-app-diskman
          [ -d luci-app-diskman ] && rm -rf luci-app-diskman/po/zh_Hant/
          git_sparse_clone openwrt-25.12 "https://github.com/immortalwrt/luci" applications/luci-app-zerotier
          git_clone https://github.com/tty228/luci-app-wechatpush luci-app-wechatpush && cd luci-app-wechatpush && rm -rf .??* docs* *.md LICENSE && cd ..
          git_sparse_clone main "https://github.com/stackia/rtp2httpd" openwrt-support/rtp2httpd openwrt-support/luci-app-rtp2httpd
          [ -f rtp2httpd/Makefile.versioned ] && mv -f rtp2httpd/Makefile.versioned rtp2httpd/Makefile
          [ -f luci-app-rtp2httpd/Makefile.versioned ] && mv -f luci-app-rtp2httpd/Makefile.versioned luci-app-rtp2httpd/Makefile

      - name: Delete duplicated packages
        run: |
          shopt -s extglob
          set +e
          rm -Rf */.git
          rm -rf doc luci-app-diskman/po/zh-tw luci-app-zerotier/po/zh_Hant
          [ -d .github/diy/packages ] && cp -rf .github/diy/packages/* ./
          rm -rf */.github
        
      - name: Apply patches
        run: |
          find ".github/diy/patches" -type f -name '*.patch' -print0 | sort -z | xargs -0 -I% sh -c "patch -p1 -E -f -F1 --no-backup-if-mismatch -i '%'"
          
      - name: Modify
        run: |
          shopt -s extglob
          set +e
          sed -i 's/\(network\..*\)\.ifname/\1.device/g' $(find . -type f \( -path "*/root/*" -o -path "*/files/*" -o -path "*/luasrc/*" \) ! -path "./base-files/*" ! -path "./dnsmasq/*" ! -path "./luci-base/*" ! -path "./ppp/*")
          sed -i 's/killall \([^-]\+\)/killall -3 \1/g' $(find . -type f \( -path "*/files/root/etc/init.d/*" -o -path "*/root/etc/init.d/*" -o -path "*/files/*.init" \))

          function latest() {
            curl -gs -H 'Content‑Type:application/json' -H "Authorization:Bearer ${{ secrets.TOKEN_LEARNSCODE }}" \
            -X POST -d '{"query":"query{repository(owner:\"'"$1"'\",name:\"'"$2"'\"){latestRelease{tagName tagCommit{oid}}defaultBranchRef{target{...on Commit{oid}}}}}"}' https://api.github.com/graphql
          }

          for pkg in $(ls */Makefile 2>/dev/null);do
            repo=$(grep PKG_SOURCE_URL "$pkg" | grep github | cut -d/ -f4‑5 | sed 's/.git//')
            [ -z "$repo" ] && continue
            read owner name <<< $(echo "$repo" | tr '/' ' ')
            res=$(latest "$owner" "$name")
            commit=$(echo "$res" | jq -r '.data.repository.defaultBranchRef.target.oid')
            sed -i "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$commit/" "$pkg"
            tag=$(echo "$res" | jq -r '.data.repository.latestRelease.tagName' | sed 's/^v//')
            oldver=$(grep PKG_VERSION "$pkg" | cut -d= -f2)
            [[ $tag > $oldver ]] && sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$tag/" "$pkg"
          done

          for dir in $(ls -d */);do
            mkf="$dir/Makefile"
            [ ! -f "$mkf" ] && continue
            grep -q PKG_VERSION "$mkf" && ! grep -q PKG_RELEASE "$mkf" && sed -i '/PKG_VERSION:=/aPKG_RELEASE:=' "$mkf"
            grep -q PKG_RELEASE "$mkf" && sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=$(git rev-list --count main "$dir")/" "$mkf"
          done
          
          sed -i -e 's?include \.\./\.\./\(lang\|devel\)?include $(TOPDIR)/feeds/packages/\1?' \
          -e 's/\(^\| \|\t\)\(PKG_HASH\|PKG_MD5SUM\|PKG_MIRROR_HASH\|HASH\):=.*/\1skip/' \
          -e 's?include .*/luci.mk?include $(TOPDIR)/feeds/luci/luci.mk?' */Makefile

          chmod +x .github/diy/*.sh
          bash .github/diy/create_acl_for_luci.sh -a
          bash .github/diy/convert_translation.sh -a
          bash .github/diy/create_ucitrack_for_luci.sh -a
          bash .github/diy/generate_ucitrack.sh -a
          chmod -R +x luci-*/root/etc/init.d luci-*/root/bin luci-*/root/sbin luci-*/root/usr/bin luci-*/root/usr/sbin luci-*/root/usr/libexec
          find . -path "*/root/usr/share/*" -name "*.sh" -exec chmod +x {} \;

      - name: Apply
        run: |
          [[ -z $(git status --porcelain) ]] && echo "无更新，跳过提交" && exit 0
          Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
          git add .
          git commit -m "${Emoji[$RANDOM % ${#Emoji[@]}]} Sync $(date '+%Y‑%m‑%d %H:%M:%S')"
          git push -f

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: 1
          keep_minimum_runs: 2
