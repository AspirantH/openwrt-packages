name: Merge-upstream
on:
  push:
    paths:
      - '.github/workflows/upstream.yml'
      - '.gitignore'
      - '.github/diy/**'
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch:
    inputs:
      ssh:
        description: 'ssh'
        required: false
        default: 'true'
  watch:
    types: started
  repository_dispatch:

jobs:
  merge:
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id || github.event.sender.id == '119362912'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0
    
    - name: Set git identity
      run : |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Sync upstream
      run: |
        shopt -s extglob
        set +e
        git rm -r --cache * >/dev/null 2>&1 &
        rm -rf `find ./* -maxdepth 0 -type d ! -name ".github/diy"` >/dev/null 2>&1
        function git_clone() {
          git clone --depth 1 $1 $2
          if [ "$?" != 0 ]; then
            echo "error on $1"
            pid="$( ps -q $$ )"
            kill $pid
          fi
        }
        function git_sparse_clone() {
        trap 'rm -rf "$tmpdir"' EXIT
        branch="$1" curl="$2" && shift 2
        rootdir="$PWD"
        tmpdir="$(mktemp -d)" || exit 1
        if [ ${#branch} -lt 10 ]; then
        git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$curl" "$tmpdir"
        cd "$tmpdir"
        else
        git clone --filter=blob:none --sparse "$curl" "$tmpdir"
        cd "$tmpdir"
        git checkout $branch
        fi
        if [ "$?" != 0 ]; then
            echo "error on $curl"
            exit 1
        fi
        git sparse-checkout init --cone
        git sparse-checkout set "$@"
        mv -n $@ $rootdir/ || true
        cd $rootdir
        }
        function mvdir() {
        mv -n `find $1/* -maxdepth 0 -type d` ./
        rm -rf $1
        }

        git_clone https://github.com/AspirantH/luci-app-lucky oplucky && mvdir oplucky
        git_clone https://github.com/sirpdboy/luci-app-partexp partexp && mvdir partexp
        git_clone https://github.com/EasyTier/luci-app-easytier luci-app-easytier1 && mvdir luci-app-easytier1
        git_clone https://github.com/OpenListTeam/OpenList-OpenWRT oplist && mvdir oplist


        sed -i 's/^PKG_HASH:=.*/PKG_HASH:=skip/' openlist/Makefile
        sed -i 's/^  HASH:=.*/  HASH:=skip/' openlist/Makefile
        # 在最后一行编译参数追加 -s -w，不插入换行破坏配置
        sed -i '/GO_PKG_LDFLAGS:=/h;${x;/\\$/!s/$/ -s -w/}' openlist/Makefile
        # upx 放到install函数末尾
        sed -i '/define Package\/openlist\/install/a\\t\/usr\/bin\/upx --lzma --best $(1)\/usr\/bin\/openlist\nendef' openlist/Makefile
        sed -i '/define Package\/openlist\/install/,/endef/{/\/usr\/bin\/upx/d}' openlist/Makefile

        sed -i 's/config_get port $1 port 5244/config_get port $1 port 8888/' openlist/files/openlist.init
        sed -i 's/config_get allow_wan $1 allow_wan 0/config_get allow_wan $1 allow_wan 1/' openlist/files/openlist.init
        sed -i 's/config_get temp_dir $1 temp_dir "\/tmp\/openlist"/config_get temp_dir $1 temp_dir "\/opt\/cache"/' openlist/files/openlist.init
        sed -i 's/config_get token_expires_in $1 token_expires_in 48/config_get token_expires_in $1 token_expires_in 999999/' openlist/files/openlist.init
        sed -i 's/config_get ssl $1 ssl 0/config_get ssl $1 ssl 1/' openlist/files/openlist.init
        sed -i 's/config_get ssl_cert $1 ssl_cert ""/config_get ssl_cert $1 ssl_cert "\/etc\/ssl.crt"/' openlist/files/openlist.init
        sed -i 's/config_get ssl_key $1 ssl_key ""/config_get ssl_key $1 ssl_key "\/etc\/ssl.key"/' openlist/files/openlist.init

        sed -i 's/option enabled '\''0'\''/option enabled '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option port '\''5244'\''/option port '\''8888'\''/' openlist/files/openlist.config
        sed -i 's/option allow_wan '\''0'\''/option allow_wan '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option temp_dir '\''\/tmp\/openlist'\''/option temp_dir '\''\/opt\/cache'\''/' openlist/files/openlist.config
        sed -i 's/option token_expires_in '\''48'\''/option token_expires_in '\''999999'\''/' openlist/files/openlist.config
        sed -i 's/option ssl '\''0'\''/option ssl '\''1'\''/' openlist/files/openlist.config
        sed -i 's/option ssl_cert '\'''\''/option ssl_cert '\''\/etc\/ssl.crt'\''/' openlist/files/openlist.config
        sed -i 's/option ssl_key '\'''\''/option ssl_key '\''\/etc\/ssl.key'\''/' openlist/files/openlist.config

        # 使用双引号外层包裹，解决单引号冲突，正常修改basic.js
        sed -i "s/default = '5244'/default = '8888'/" openlist/luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
        sed -i "s/default = '\/tmp\/openlist'/default = '\/opt\/cache'/" openlist/luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js
        sed -i "s/default = '48'/default = '999999'/" openlist/luci-app-openlist/htdocs/luci-static/resources/view/openlist/basic.js

        cp -f .github/diy/data.db openlist/files/data.db
        git_clone https://github.com/eamonxg/luci-theme-aurora luci-theme-aurora && (cd luci-theme-aurora && rm -rf .??* docs* *.md LICENSE)
        git_clone https://github.com/destan19/luci-app-harbor-file luci-app-harbor-file && (cd luci-app-harbor-file && rm -rf .??* docs* *.md LICENSE)
        git_sparse_clone master "https://github.com/coolsnowwolf/packages" net/verysync
        git_sparse_clone main "https://github.com/kiddin9/op-packages" luci-app-verysync
        git_sparse_clone main "https://github.com/kiddin9/op-packages" luci-mod-network luci-mod-status luci-mod-system && rm -rf luci-mod-system/htdocs/luci-static/resources/view/system/leds.js && rm -rf luci-mod-system/htdocs/luci-static/resources/view/system/led-trigger/

        sed -i '/"admin\/system\/leds": {/,/^	},/d' luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json
        sed -i '/"fs": { "\/sys\/class\/leds": "directory" }/,/^	},/d' luci-mod-system/root/usr/share/luci/menu.d/luci-mod-system.json
        sed -i '/"init": "led",/d' luci-mod-system/root/usr/share/ucitrack/luci-mod-system-system.json
        sed -i 's/"getLEDs", //g' luci-mod-system/root/usr/share/rpcd/acl.d/luci-mod-system.json

        git_sparse_clone openwrt-25.12 "https://github.com/coolsnowwolf/luci" applications/luci-app-diskman && rm -rf luci-app-diskman/po/zh_Hant/
        git_sparse_clone openwrt-25.12 "https://github.com/immortalwrt/luci" applications/luci-app-zerotier
        git_clone https://github.com/tty228/luci-app-wechatpush && (cd luci-app-wechatpush && rm -rf .??* docs* *.md LICENSE)
        git_sparse_clone main "https://github.com/stackia/rtp2httpd" openwrt-support/rtp2httpd && mv -f rtp2httpd/Makefile.versioned rtp2httpd/Makefile
        git_sparse_clone main "https://github.com/stackia/rtp2httpd" openwrt-support/luci-app-rtp2httpd && mv -f luci-app-rtp2httpd/Makefile.versioned luci-app-rtp2httpd/Makefile

    - name: Delete duplicated packages
      run: |
        shopt -s extglob
        set +e
        rm -Rf */.git
        rm -rf doc
        rm -rf luci-app-diskman/po/zh-tw
        rm -rf luci-app-zerotier/po/zh_Hant
        for pkg in $(ls -d .github/diy/packages/*); do
          mv -f $pkg/Makefile.k $pkg/Makefile >/dev/null 2>&1 || true
        done
        cp -rf .github/diy/packages/* ./ || true
        for pkg in $(ls -d .github/diy/packages/*); do
          mv -f $pkg/Makefile $pkg/Makefile.k >/dev/null 2>&1 || true
        done
        rm -rf */.github
        
    - name: Apply patches
      run: |
        find ".github/diy/patches" -type f -name '*.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -p1 -E -f -F 1 --no-backup-if-mismatch -i '%'"
        
    - name: Modify
      run: |
        shopt -s extglob
        set +e
        sed -i \
        -e "s/\(network\..*\)\.ifname/\1.device/g" \
        `find \( -path "*/root/*" -o -path "*/files/*" -o -path "*/luasrc/*" \) ! -path "./base-files/*" ! -path "./dnsmasq/*" ! -path "./luci-base/*" ! -path "./ppp/*" -type f` &
        # sed -i -e "s/\(killall .*\)-[0-9] /\1-3 /g" \
        -e "s/killall \([^-]+*\)/killall -3 \1/g" \
        `find \( -path "*/files/root/etc/init.d/*" -o -path "*/root/etc/init.d/*" -o -path "*/files/*.init" \) -type f` &
        (
        function latest() {
          (curl -gs -H 'Content-Type: application/json' \
             -H "Authorization: Bearer ${{ secrets.TOKEN_LEARNSCODE }}" \
             -X POST -d '{ "query": "query {repository(owner: \"'"$1"'\", name: \"'"$2"'\"){latestRelease{tagName tagCommit{oid}}refs(refPrefix:\"refs/tags/\",last:1,orderBy:{field:TAG_COMMIT_DATE,direction:ASC}){edges{node{name target{oid}}}}defaultBranchRef{target{...on Commit {oid}}}}}"}' https://api.github.com/graphql)
        }
        for pkg in $(ls */Makefile 2>/dev/null); do
          repo="$(grep ^PKG_SOURCE_URL $pkg | grep github | cut -f 4-5 -d '/' | sed -e 's/.git//' | grep -E '[0-9a-zA-Z_-]+$')" || true
          if [ "$repo" ]; then
            owner="$(echo $repo | cut -f 1 -d '/')"
            name="$(echo $repo | cut -f 2 -d '/')"
            latest="$(latest $owner $name)"
            sed -i "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$(echo $latest | jq -r '.data.repository.defaultBranchRef.target.oid')/" $pkg || true
            over="$(grep -E PKG_VERSION:=.*$ $pkg | cut -f 2 -d '=' | sed -e 's/^\(v\|release-\)//' | grep -E "[0-9]")" || true
            if [ "$over" ]; then
              ver="$(echo $latest | jq -r '.data.repository.latestRelease.tagName' | sed -e 's/^\(v\|release-\)//' | grep -E "^[^()]*$" | grep -E "[0-9]")" || true
              # [ "$ver" ] || ver="$(git ls-remote --tags git://github.com/$repo | cut -d/ -f3- | sort -t. -nk1,3 | awk '/^[^{]*$/{version=$1}END{print version}' | grep -o -E "[0-9].*")" || true
              echo "$repo-$over-$ver"
              if [ "$ver" ]; then
                function version_lt() { test "$(echo "$@" | tr " " "\n" | sort -rV | head -n 1)" != "$1"; }
                if version_lt "$over" "$ver"; then
                  latest="$(echo $latest | jq -r '.data.repository.latestRelease.tagCommit.oid' || echo $latest | jq -r '.data.repository.refs.edges[-1].node.target.oid')"
                  sed -i -e "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$latest/" \
                         -e "s/PKG_VERSION:=.*/PKG_VERSION:=$ver/" $pkg || true
                fi || true
              fi
            fi
          fi
        done
        touch /tmp/ok
        ) &

        (
        for pkg in $(ls -d */); do
          if [[ "$(grep "PKG_VERSION" $pkg/Makefile)" && ! "$(grep "PKG_RELEASE" $pkg/Makefile)" ]]; then
            sed -i "s/\(PKG_VERSION:=.*\)/\1\nPKG_RELEASE:=/" $pkg/Makefile || true
          fi
          if [ "$(grep "PKG_RELEASE" $pkg/Makefile)" ]; then
            sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=$(git rev-list --count main $pkg)/" $pkg/Makefile || true
          fi

        done
        touch /tmp/ok2
        ) &
        
        sed -i \
          -e 's?include \.\./\.\./\(lang\|devel\)?include $(TOPDIR)/feeds/packages/\1?' \
          -e "s/\(\(^\| \|	\)\(PKG_HASH\|PKG_MD5SUM\|PKG_MIRROR_HASH\|HASH\):=\).*/\1skip/" \
          -e 's?include .*/luci.mk?include $(TOPDIR)/feeds/luci/luci.mk?' \
          */Makefile

        chmod +x .github/diy/*.sh
        bash .github/diy/create_acl_for_luci.sh -a >/dev/null 2>&1 || true
        bash .github/diy/convert_translation.sh -a >/dev/null 2>&1 || true
        bash .github/diy/create_ucitrack_for_luci.sh -a >/dev/null 2>&1 || true
        bash .github/diy/generate_ucitrack.sh -a >/dev/null 2>&1 || true
        chmod -R +x luci-*/root/etc/init.d/ luci-*/root/bin/ luci-*/root/sbin/ luci-*/root/usr/libexec/ luci-*/root/usr/bin/ luci-*/root/usr/sbin/
        find . -path "./luci-*/root/usr/share/*" -name "*.sh" -type f -exec chmod +x {} \;
        
        while [[ ! -f /tmp/ok || ! -f /tmp/ok2 || ! -f /tmp/ok3 ]]; do
            echo "wait"
          sleep 1
        done

    - name: Apply
      run: |

        if [ -z "$(git status --porcelain)" ]; then
          echo "✅ No changes to commit, skipping apply."
          exit 0
        fi

        Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
        git add .
        git commit -m "${Emoji[$[$RANDOM % ${#Emoji[@]}]]} Sync $(date +%Y-%m-%d" "%H:%M:%S)"

        for pkg in $(git diff-tree --no-commit-id --name-only HEAD | grep -v "naiveproxy" | grep -v "luci-app-passwall"); do
          if [ "$(grep "PKG_RELEASE" $pkg/Makefile)" ]; then
            sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=$(git rev-list --count main $pkg)/" $pkg/Makefile || true
          fi
        done

        git reset --soft HEAD^
        git add .
        git commit -m "${Emoji[$[$RANDOM % ${#Emoji[@]}]]} Sync $(date +%Y-%m-%d" "%H:%M:%S)"
        git push -f

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 1
        keep_minimum_runs: 2
